# QTL_Bot - 依存パッケージの固定版（ロックファイル）
#
# requirements.txt（下限指定のみ）の「開発用ツールを除く全項目」と、その依存パッケージ
# （推移的依存）を、版を固定して並べたもの。再現性のあるインストールには、こちらを使う:
#
#   pip install -r requirements.lock
#
# 【脆弱性・版ずれの確認】
#   pip install pip-audit          # 初回のみ
#   python3 bot.py --audit_deps    # このファイルの内容を既知の脆弱性DBと照合する
#
# 【更新するとき】
#   1. 新しい版を試し、動作確認（pytest・実機）してから、下の版番号を書き換える
#   2. python3 bot.py --audit_deps で脆弱性が無いことを確認
#   3. このファイルをコミットする
#
# 【更新履歴】
#   2026-10-15  既知の脆弱性（pip-audit）が報告された次の9件を更新。更新後は報告なし。
#               aiohttp 3.13.3→3.14.3 / pillow 11.1.0→12.3.0 / urllib3 2.3.0→2.8.0 /
#               requests 2.32.3→2.33.1 / idna 3.10→3.15 / multidict 6.7.1→6.9.1 /
#               python-dotenv 1.0.1→1.2.2 / yarl 1.23.0→1.25.1（aiohttp の依存）/
#               propcache 0.4.1→0.5.4（yarl の依存）
#               ※ 上記以外は、それまで本番機で動作していた版のまま。
#               ※ 更新した版は、このファイルの版だけを入れた環境で pytest（GIS 描画を含む）を
#                  通したのみで、実機（Raspberry Pi）での動作確認は別途必要。
#   2026-10-12  本番機（Raspberry Pi）で動作していた版を固定（初版）
#
# 注: 行末の「; python_version >= ...」は環境マーカー。該当しないPythonでは無視される。

