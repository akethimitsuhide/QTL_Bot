# QTL_Bot - 依存パッケージの固定版（ロックファイル）
#
# 本番機（Raspberry Pi）で実際に動作している版を固定したもの。
# requirements.txt（下限指定のみ）の「開発用ツールを除く全項目」と、その依存パッケージ
# （推移的依存）を含む。再現性のあるインストールには、こちらを使う:
#
#   pip install -r requirements.lock
#
# 【脆弱性・版ずれの確認】
#   pip install pip-audit          # 初回のみ
#   python3 bot.py --audit_deps    # このファイルの内容を既知の脆弱性DBと照合する
#
# 【更新するとき】
#   1. 新しい版を試し、動作確認（pytest・実機）してから、下の版番号を書き換える
#   2. python3 bot.py --audit_deps で脆弱性が無いことを確認
#   3. このファイルをコミットする
#
# 注: 行末の「; python_version >= ...」は環境マーカー。該当しないPythonでは無視される。

